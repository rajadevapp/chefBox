<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login and Signup Form</title>

    <!-- Tailwind CSS 2.2.19 CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
</head>

<body class="min-h-screen flex items-center justify-center p-4" style="background-color: #FFFCF7;">

    <!-- Main form started-->
    <div class="relative w-full max-w-md rounded-xl p-6 sm:p-8 shadow-lg" style="background-color: #FFFCF7;">

        <!-- Close button created -->
        <button type="button" id="closeBtn" aria-label="Close form"
            class="absolute top-3 right-4 text-2xl text-gray-500 hover:text-gray-900">
            &times;
        </button>

        <!-----------Login Form -->
        <div id="loginForm" class="pt-4">

            <h2 class="text-2xl font-bold text-gray-800 mb-6">Log In</h2>

            <form id="loginSubmit" novalidate class="space-y-4">

                <div>
                    <label for="loginEmail" class="block text-sm font-medium text-gray-700 mb-1">
                        Email or Phone Number
                    </label>

                    <input type="text" id="loginEmail" placeholder="Enter email or 10-digit phone number" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg
                   focus:outline-none focus:ring-2 focus:ring-blue-500">

                    <p id="loginEmailError" class="mt-1 text-sm text-red-600 hidden"></p>
                </div>

                <div>
                    <label for="loginPassword" class="block text-sm font-medium text-gray-700 mb-1">
                        Password
                    </label>

                    <input type="password" id="loginPassword" placeholder="Enter password" required class="w-full px-4 py-3 border border-gray-300 rounded-lg
                   focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3
                 rounded-lg hover:bg-blue-700 transition">
                    Submit
                </button>

            </form>

            <p class="text-sm text-gray-600 text-center mt-6">
                If you don't have an account, please
            </p>

            <!-- Sign Up Button -->
            <button type="button" id="showSignup" class="w-full mt-3 border border-blue-600 text-blue-600
               font-semibold py-3 rounded-lg hover:bg-blue-50 transition">
                Sign Up
            </button>

        </div>

        <!-- Signin form-->
        <div id="signupForm" class="hidden pt-4">

            <h2 class="text-2xl font-bold text-gray-800 mb-6">Sign Up</h2>

            <form id="signupSubmit" novalidate class="space-y-4">

                <!-- First Name and Last Name -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                    <div>
                        <label for="firstName" class="block text-sm font-medium text-gray-700 mb-1">
                            First Name
                        </label>

                        <input type="text" id="firstName" placeholder="Enter your first name" required class="w-full min-w-0 px-3 py-3 border border-gray-300
                     rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div>
                        <label for="lastName" class="block text-sm font-medium text-gray-700 mb-1">
                            Last Name
                        </label>

                        <input type="text" id="lastName" placeholder="Enter your last name" required class="w-full min-w-0 px-3 py-3 border border-gray-300
                     rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                </div>

                <!-- Mobile Number -->
                <div>
                    <label for="mobile" class="block text-sm font-medium text-gray-700 mb-1">
                        Mobile Number
                    </label>

                    <input type="tel" id="mobile" placeholder="Enter your 10-digit mobile number" inputmode="numeric"
                        maxlength="10" required class="w-full px-4 py-3 border border-gray-300 rounded-lg
                   focus:outline-none focus:ring-2 focus:ring-blue-500">

                    <p id="mobileError" class="mt-1 text-sm text-red-600 hidden"></p>
                </div>

                <!-- Signup Email -->
                <div>
                    <label for="signupEmail" class="block text-sm font-medium text-gray-700 mb-1">
                        Email Address
                    </label>

                    <input type="text" id="signupEmail" placeholder="Enter your email" required class="w-full px-4 py-3 border border-gray-300 rounded-lg
                   focus:outline-none focus:ring-2 focus:ring-blue-500">

                    <p id="signupEmailError" class="mt-1 text-sm text-red-600 hidden"></p>
                </div>

                <!-- Signup Password -->
                <div>
                    <label for="signupPassword" class="block text-sm font-medium text-gray-700 mb-1">
                        Password
                    </label>

                    <input type="password" id="signupPassword" placeholder="Enter password (minimum 8 characters)"
                        minlength="8" required class="w-full px-4 py-3 border border-gray-300 rounded-lg
                   focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3
                 rounded-lg hover:bg-blue-700 transition">
                    Submit
                </button>

            </form>

            <p class="text-sm text-gray-600 text-center mt-6">
                Already have an account?
            </p>

            <!-- Login Here Button -->
            <button type="button" id="showLogin" class="w-full mt-3 border border-blue-600 text-blue-600
               font-semibold py-3 rounded-lg hover:bg-blue-50 transition">
                Login here
            </button>

        </div>

    </div>

    <!-- JS code using Dom -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const loginForm = document.getElementById("loginForm");
            const signupForm = document.getElementById("signupForm");

            const showSignup = document.getElementById("showSignup");
            const showLogin = document.getElementById("showLogin");
            const closeBtn = document.getElementById("closeBtn");

            function openSignup() {
                loginForm.classList.add("hidden");
                signupForm.classList.remove("hidden");
            }

            function openLogin() {
                signupForm.classList.add("hidden");
                loginForm.classList.remove("hidden");
            }

            showSignup.addEventListener("click", openSignup);
            showLogin.addEventListener("click", openLogin);
            closeBtn.addEventListener("click", openLogin);

            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const phonePattern = /^\d{10}$/;

            function showError(input, errorElement, message) {
                errorElement.textContent = message;
                errorElement.classList.remove("hidden");
                input.classList.add("border-red-500");
                input.setAttribute("aria-invalid", "true");
            }
            function clearError(input, errorElement) {
                errorElement.textContent = "";
                errorElement.classList.add("hidden");
                input.classList.remove("border-red-500");
                input.removeAttribute("aria-invalid");
            }

            // --------------------------- Login validation -------------------------
            const loginEmail = document.getElementById("loginEmail");
            const loginEmailError = document.getElementById("loginEmailError");

            loginEmail.addEventListener("input", function () {
                clearError(loginEmail, loginEmailError);
            });

            document.getElementById("loginSubmit").addEventListener(
                "submit",
                function (event) {
                    event.preventDefault();

                    const value = loginEmail.value.trim();

                    const isEmail = emailPattern.test(value);
                    const isPhone = phonePattern.test(value);

                    if (!isEmail && !isPhone) {
                        showError(
                            loginEmail,
                            loginEmailError,
                            "Enter a valid email address or a 10-digit phone number."
                        );
                        return;
                    }

                    clearError(loginEmail, loginEmailError);
                    alert("Login form submitted successfully!");
                }
            );

            // ------------Signup Email Validation--------------------------------
            const signupEmail = document.getElementById("signupEmail");
            const signupEmailError = document.getElementById("signupEmailError");

            signupEmail.addEventListener("input", function () {
                clearError(signupEmail, signupEmailError);
            });

            // ------------------------- Moile Validation -------------------------
            const mobile = document.getElementById("mobile");
            const mobileError = document.getElementById("mobileError");

            mobile.addEventListener("input", function () {
                mobile.value = mobile.value.replace(/\D/g, "").slice(0, 10);
                clearError(mobile, mobileError);
            });

            // --------------------------SIGNUP VALIDATION -----------------------
            document.getElementById("signupSubmit").addEventListener(
                "submit",
                function (event) {
                    event.preventDefault();

                    let isValid = true;

                    
                    if (!emailPattern.test(signupEmail.value.trim())) {
                        showError(
                            signupEmail,
                            signupEmailError,
                            "Please enter a valid email, such as name@example.com."
                        );
                        isValid = false;
                    } else {
                        clearError(signupEmail, signupEmailError);
                    }

                  
                    if (!phonePattern.test(mobile.value)) {
                        showError(
                            mobile,
                            mobileError,
                            "Mobile number must contain exactly 10 digits."
                        );
                        isValid = false;
                    } else {
                        clearError(mobile, mobileError);
                    }

                   
                    if (!isValid) {
                        return;
                    }

                    alert("Signup form submitted successfully!");
                }
            );

        });
    </script>

</body>

</html>
