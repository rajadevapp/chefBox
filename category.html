<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category</title>
    <link rel="stylesheet" href="./style/category.css"/>
    <link rel="stylesheet" href="./style/style.css"/>
</head>
<body>
    <header class="navbar">
        <a href="./index.html" class="logo">Chef<span>Box.</span></a>
        <button class="menu-toggle" id="menu-toggle" aria-label="Open navigation menu" aria-expanded="false"
            aria-controls="nav-links">
            ☰
        </button>

        <nav class="nav-links" id="nav-links">
            <a href="./index.html">Home</a>
            <a href="./category.html" class="nav-active">Categories</a>
            <a href="./index.html#recommendations">Recipes</a>
            <a href="./planner.html">Meal Planner</a>

            <!-- Login Button -->
            <a href="#login" class="login-btn">Login</a>
        </nav>
    </header>
    <section id="category">
        <div class="category">
            <div class="category__filter">
                <div class="filters">
                    <div class="category__filter-search-box">
                        <input type="text" id="category-search" placeholder="Search your recipe"/>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                        stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="7" />
                            <path d="m20 20-4-4" />
                        </svg>    
                    </div>
                    <div class="select-filter">
                        <div class="select-box" data-filter="category">
                            <button class="select-btn" type="button" style="width: 220px;">
                            <span data-default="category">Category</span>
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                                    <path d="m6 9 6 6 6-6"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"/>
                                </svg>
                            </button>
                            <ul class="select-menu">
                            <li data-value="all" class="active">Category</li>
                            <li data-value="Weight Loss">Weight Loss</li>
                            <li data-value="Muscle Gain">Muscle Gain</li>
                            <li data-value="High-Protein">High-Protein</li>
                            <li data-value="Blood Pressure-Friendly">Blood Pressure-Friendly</li>
                            <li data-value="Diabetic-Friendly">Diabetic-Friendly</li>
                            </ul>
                        </div>
                        <div class="reset-filter">
                            <button type="button" id="reset_filter">
                                <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="24"
                                height="24"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.6"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                >
                                <path d="M3 11a9 9 0 1 1 2.64 6.36" />
                                <path d="M3 4v7h7" />
                                </svg>                        
                                <span class="rest-filter-label">Reset</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="recipe-div">
                <div id="recipe-list" class="recipe-grid">
                </div>
            </div>
        </div>
    </section>
    <!-- Footer -->
    <footer class="footer">
        <a href="./index.html" class="logo footer-logo">Chef<span>Box.</span></a>
        <p>Good food. Good mood. Every day.</p>
        <p class="copyright">© 2026 ChefBox. Made with care.</p>
    </footer>
    <script src="./script/script.js"></script>
    <script src="./script/category.js"></script>
</body>
</html>
